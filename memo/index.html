<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手書きメモ">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2-180.png">
<title>手書きメモ（引っ越しました）</title>
<style>
  body { margin: 0; background: #e9edf0; color: #1f2a30; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  .box { max-width: 520px; margin: 18vh auto 0; padding: 0 20px; text-align: center; line-height: 1.8; }
  a { display: inline-block; margin-top: 12px; background: #2f4858; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 12px; font-weight: 700; }
</style>
</head>
<body>
<div class="box">
  手書きメモは新しいアドレスに引っ越しました。<br>自動で移動します…
  <br><a id="go" href="/tegaki-memo/">新しい手書きメモを開く</a>
</div>
<script>
(function () {
  var url = '/tegaki-memo/' + (location.hash || '');
  document.getElementById('go').href = url;
  // 古い場所に登録した Service Worker を外す（新しい端末のみ）
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (list) {
        for (var i = 0; i < list.length; i++) if (/\/kiku990\/memo\/$/.test(list[i].scope)) list[i].unregister();
      })['catch'](function () {});
    }
  } catch (e) {}
  setTimeout(function () { location.replace(url); }, 300);
})();
</script>
</body>
</html>
